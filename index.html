<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion de Stock</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1e40af; padding: 30px 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 24px; }
        
        .stats { background: #bfdbfe; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .stats h2 { color: #1e3a8a; font-size: 20px; }
        
        .form-add { background: #bfdbfe; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .form-add h3 { margin-bottom: 15px; color: #1e3a8a; font-size: 15px; }
        input { padding: 10px; margin-right: 8px; border: none; border-radius: 6px; width: 140px; }
        .btn-add { background: #4338ca; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .product { background: #bfdbfe; padding: 15px 20px; margin: 12px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .alert { border-left: 5px solid #ef4444; }
        .product h3 { color: #1e293b; font-size: 16px; }
        .product p { color: #475569; font-size: 13px; }
        .stock-low { color: #ef4444; font-weight: bold; }
        
        button { padding: 7px 14px; margin-left: 6px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .btn-plus { background: #14b8a6; color: white; }
        .btn-minus { background: #f87171; color: white; }
        .btn-delete { background: #64748b; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Gestion de Stock - Supermarché</h1>

        <div class="stats">
            <h2>💰 Valeur Totale du Stock: <span id="totalValue">0</span> DH</h2>
        </div>

        <div class="form-add">
            <h3>+ Ajouter un Produit</h3>
            <input type="text" id="name" placeholder="Nom du produit">
            <input type="number" id="stock" placeholder="Stock" value="0">
            <input type="number" id="prix" placeholder="Prix DH" value="0">
            <button class="btn-add" onclick="addProduct()">Ajouter</button>
        </div>

        <div id="products">Chargement...</div>
    </div>

    <script>
        function loadProducts() {
            fetch('http://localhost:5000/api/products')
            .then(res => res.json())
            .then(data => {
                // Calculer total
                let total = data.reduce((sum, p) => sum + (p.stock * p.prix), 0);
                document.getElementById('totalValue').innerText = total;

                let html = '';
                data.forEach(p => {
                    let alertClass = p.stock < 10 ? 'alert' : '';
                    let stockClass = p.stock < 10 ? 'stock-low' : '';
                    html += `
                    <div class="product ${alertClass}">
                        <div>
                            <h3>${p.name}</h3>
                            <p>Stock: <span class="${stockClass}">${p.stock}</span> | Prix: ${p.prix} DH | Total: ${p.stock * p.prix} DH ${p.stock < 10 ? '⚠️' : ''}</p>
                        </div>
                        <div>
                            <button class="btn-plus" onclick="updateStock(${p.id}, 1)">+1</button>
                            <button class="btn-minus" onclick="updateStock(${p.id}, -1)">-1</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑️</button>
                        </div>
                    </div>`;
                });
                document.getElementById('products').innerHTML = html;
            });
        }

        function updateStock(id, change) {
            fetch(`http://localhost:5000/api/products/${id}/update`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({change})
            }).then(() => loadProducts());
        }

        function addProduct() {
            const name = document.getElementById('name').value;
            const stock = parseInt(document.getElementById('stock').value);
            const prix = parseFloat(document.getElementById('prix').value);
            if(name === '') return alert('Entrez le nom');
            fetch('http://localhost:5000/api/products', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({name, stock, prix})
            }).then(() => { 
                document.getElementById('name').value = ''; 
                loadProducts(); 
            });
        }

        function deleteProduct(id) {
            if(confirm('Supprimer ce produit?')) {
                fetch(`http://localhost:5000/api/products/${id}`, {method: 'DELETE'})
                .then(() => loadProducts());
            }
        }

        loadProducts();
    </script>
</body>
</html>
